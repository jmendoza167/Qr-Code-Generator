name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the repository. No tokens with write
# access are handed to the steps.
permissions:
  contents: read

# A new push to the same branch/PR cancels the runs still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      # Third-party actions are pinned to full commit SHAs so that a moved or
      # compromised tag cannot change what runs here. Bump the SHA and the
      # version comment together.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: dependencies never get to run install scripts in CI
      # (also set in .npmrc; repeated here so it holds even without that file).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
